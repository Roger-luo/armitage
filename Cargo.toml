[workspace]
resolver = "2"
members = [
    "crates/armitage-core",
    "crates/armitage-labels",
    "crates/armitage-github",
    "crates/armitage-sync",
    "crates/armitage-triage",
    "crates/armitage-chart",
    "crates/armitage-project",
    "crates/armitage",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
# Internal crates — `version` is included so that once release-plz upstream
# (release-plz#2789) lands a fallback for unpublished workspace deps, cargo
# package's diff step can resolve them. The exact pin (`=`) is fine since the
# entire workspace bumps together.
armitage-core = { path = "crates/armitage-core", version = "=0.1.2" }
armitage-labels = { path = "crates/armitage-labels", version = "=0.1.2" }
armitage-github = { path = "crates/armitage-github", version = "=0.1.2" }
armitage-sync = { path = "crates/armitage-sync", version = "=0.1.2" }
armitage-triage = { path = "crates/armitage-triage", version = "=0.1.2" }
armitage-chart = { path = "crates/armitage-chart", version = "=0.1.2" }
armitage-project = { path = "crates/armitage-project", version = "=0.1.2" }

# External crates
askama = "0.14"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
ionem = { version = "0.2.0", features = ["gh", "git", "self-update"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
thiserror = "2"
toml = "1.1"
rusqlite = { version = "0.39", features = ["bundled"] }
rustyline = "18"
console = "0.16"
dialoguer = "0.12"
indicatif = "0.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = "3"
notify = { version = "8", default-features = false, features = ["macos_kqueue"] }
tempfile = "3"
termimad = "0.34.1"
insta = "1"
